<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메모리 사용량 Top 20</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body class="memory-page">
  <main>
    <header class="heading">
      <div>
        <h1>메모리 사용량 Top 20</h1>
        <p class="subtitle">실행 중인 프로세스를 메모리 사용량이 큰 순서로 표시합니다.</p>
      </div>
      <div class="summary"><span>총 사용량</span><strong id="total"></strong></div>
    </header>
    <section class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th class="rank">순위</th><th>프로세스</th><th>PID</th><th>상태</th><th class="number">CPU (%)</th><th class="number">스레드</th><th class="number">핸들</th><th>메모리 사용량</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
    <p class="time" id="time" style="margin-top:14px"></p>
  </main>
  <script>
    const capturedAt = '2026-09-11 13:52:57 +09:00';
    const data = [
      ['Discord',12976,'Responding',0,439.24,52,1606],['ChatGPT',15408,'Responding',3,430.76,21,332],['MsMpEng',4688,'Responding',0,402.61,48,1088],['chrome',10532,'Responding',0,381.30,24,448],['chrome',2692,'Responding',0,359.68,27,1390],['Zoom',13160,'Responding',2,335.88,84,1479],['chrome',12312,'Responding',0,320.69,47,2342],['chrome',6312,'Responding',0,305.78,22,386],['ChatGPT',10428,'Responding',1,300.67,56,1652],['chrome',16352,'Responding',0,295.38,26,523],['chrome',12940,'Responding',0,288.22,23,505],['Discord',6640,'Responding',0,249.62,24,1079],['ChatGPT',5492,'Responding',0,243.11,19,318],['SearchApp',5168,'Responding',0,231.17,38,1183],['explorer',16304,'Responding',0,229.70,74,2731],['ChatGPT',12596,'Responding',1,226.45,23,773],['codex',12428,'Responding',0,194.41,88,586],['Zoom',7048,'Responding',0,157.91,53,1330],['Discord',6740,'Responding',0,151.86,67,1138],['PhoneExperienceHost',6444,'Responding',0,149.51,17,919]
    ].sort((a,b)=>b[4]-a[4]);
    const max = data[0][4];
    document.getElementById('rows').innerHTML = data.map((d,i)=>`<tr><td class="rank">${i+1}</td><td class="process">${d[0]}</td><td>${d[1]}</td><td class="status">정상</td><td class="number">${d[3]}</td><td class="number">${d[5]}</td><td class="number">${d[6].toLocaleString()}</td><td class="chart-cell"><div class="bar-row"><div class="bar-track"><div class="bar" style="width:${(d[4]/max*100).toFixed(1)}%;animation-delay:${i*25}ms"></div></div><span class="bar-value">${d[4].toFixed(2)} MB</span></div></td></tr>`).join('');
    document.getElementById('total').textContent = `${data.reduce((s,d)=>s+d[4],0).toLocaleString(undefined,{maximumFractionDigits:2})} MB`;
    document.getElementById('time').textContent = `측정 시각: ${capturedAt}`;
  </script>
</body>
</html>
